name: Build standalone Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the single-file executable
        run: cargo build --release --locked
      - name: Upload the standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: ChessTrainer-Windows
          path: target/release/ChessTrainer.exe
          if-no-files-found: error
          retention-days: 90
